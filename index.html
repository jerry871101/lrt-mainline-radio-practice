<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>淡海輕軌正線無線電練習</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    line-height: 1.65;
    padding: 12px;
    font-size: 15px;
    padding-top: 345px; /* 為固定置頂 CMS 預留空間（高度 335 + 邊距） */
  }
  /* 整個 App 限制最大寬度並置中（640px 才容得下首頁資訊排 + 右側直立列車） */
  .main-content { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 6px 0 14px; text-align: center; color: #60a5fa; }
  .card { background: #1e293b; border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: #93c5fd; border-bottom: 1px solid #334155; padding-bottom: 6px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
  select, button, input { width: 100%; padding: 10px 12px; font-size: 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; margin-bottom: 10px; font-family: inherit; }
  button { background: #2563eb; border-color: #2563eb; color: white; font-weight: bold; cursor: pointer; padding: 13px; font-size: 16px; }
  button:active { background: #1d4ed8; }
  button:disabled { background: #475569; border-color: #475569; opacity: 0.6; cursor: not-allowed; }
  button.secondary { background: #475569; border-color: #475569; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* CMS 核心樣式 */
  .cms-area {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2000;
    max-width: 640px; margin-left: auto; margin-right: auto; /* 與 .main-content 同寬置中 */
    background: #000; border-bottom: 4px solid #475569; padding: 12px; height: 335px;
    display: flex; flex-direction: column; gap: 8px; font-family: "Consolas", monospace;
    box-shadow: 0 5px 20px rgba(0,0,0,0.9);
  }
  .cms-screen { flex: 1; background: #000; border: 1px solid #334155; border-radius: 4px; position: relative; overflow: hidden; }
  .cms-page { display: none; height: 100%; padding: 10px; }
  .cms-page.active { display: block; }
  
  .cms-nav-container { display: flex; flex-direction: column; gap: 4px; }
  .cms-sub-nav {
    display: none; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #111827;
    padding: 4px; border-radius: 4px; border: 1px solid #334155;
  }
  .cms-sub-nav.active { display: grid; }
  
  .cms-main-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .nav-btn {
    background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
    color: #94a3b8; border: 2px solid #475569; padding: 10px 2px;
    font-size: 13px; text-align: center; cursor: pointer; border-radius: 6px; font-weight: bold;
    box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,0.1);
    transition: all 0.05s; user-select: none; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #000; background: #0f172a; }
  .nav-btn.active { background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); color: white; border-color: #60a5fa; box-shadow: 0 1px 0 #000, inset 0 1px 3px rgba(0,0,0,0.5); }
  .nav-btn.alert { animation: blink-yellow 1s infinite; color: #fbbf24; border-color: #fbbf24; }
  
  .sub-nav-btn {
    background: linear-gradient(180deg, #475569 0%, #334155 100%); color: #e2e8f0; border: 1px solid #64748b; padding: 8px 2px;
    font-size: 11px; text-align: center; cursor: pointer; border-radius: 4px; box-shadow: 0 2px 0 #000; transition: all 0.05s; user-select: none;
  }
  .sub-nav-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #000; }
  .sub-nav-btn.active { background: #1e3a8a; border-color: #3b82f6; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }

  .cms-page button, .cms-page .sub-btn {
    background: linear-gradient(180deg, #334155 0%, #1e293b 100%); border: 2px solid #475569; color: #f1f5f9; padding: 10px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; box-shadow: 0 3px 0 #000; transition: all 0.05s;
    width: auto; min-width: 100px; margin-bottom: 5px; display: inline-flex; align-items: center; justify-content: center;
  }
  .cms-page button:active, .cms-page .sub-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #000; }
  .cms-page button.secondary { background: #1e293b; color: #94a3b8; border-color: #334155; }
  .sub-btn.highlight { border-color: #fbbf24 !important; color: #fbbf24 !important; box-shadow: 0 0 10px #78350f !important; animation: blink-yellow-light 1s infinite !important; }
  @keyframes blink-yellow-light { 50% { opacity: 0.7; border-color: #f59e0b; } }

  .cms-layout { display: grid; grid-template-columns: 1fr 140px; gap: 15px; height: 100%; }
  .cms-gear-display { width: 60px; height: 60px; background: #000; border: 3px solid #475569; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #4ade80; border-radius: 8px; }
  .cms-gear-display.fault { color: #ef4444; border-color: #ef4444; }
  .atp-hmi { width: 100px; height: 75px; background: #064e3b; border: 2px solid #334155; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .atp-hmi.fault { background: #7f1d1d; }
  .atp-limit { font-size: 36px; font-weight: bold; }
  .cms-icon { width: 45px; height: 45px; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; border-radius: 6px; }
  .cms-icon.active-t { color: #4ade80; border-color: #4ade80; }
  .cms-icon.inactive { color: #1e293b; border-color: #1e293b; }
  .cms-icon.fault { color: #ef4444; border-color: #ef4444; animation: blink 1s infinite; }
  /* 380V 閃電：正常白燈，有動力問題轉黃燈（非紅燈） */
  .cms-icon.v380-normal { color: #e5e7eb; border-color: #94a3b8; }
  .cms-icon.v380-fault { color: #fbbf24; border-color: #fbbf24; animation: blink 1s infinite; }
  .door-box { height: 14px; background: #1e293b; border: 1px solid #334155; }
  .door-box.open { background: #3b82f6; }
  .door-box.offline { background: #4b5563; position: relative; }
  .door-box.offline::after { content: "×"; color: #fff; position: absolute; top: -4px; left: 2px; font-size: 12px; }
  @keyframes blink { 50% { opacity: 0.3; } }
  @keyframes blink-yellow { 50% { background: #78350f; } }
  .emergency-panel { background: #450a0a; border: 2px solid #991b1b; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
  .em-btn { background: #7f1d1d; color: #fff; border: 2px solid #dc2626; padding: 12px; font-size: 14px; border-radius: 4px; text-align: center; font-weight: bold; cursor: pointer; }
  .em-btn.highlight { background: #ef4444; box-shadow: 0 0 15px #ef4444; }
  .em-btn.used { background: #1e293b; color: #475569; border-color: #334155; cursor: not-allowed; }
  .chunk { background: #0f172a; border-left: 3px solid #3b82f6; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .chunk.final { border-left-color: #10b981; }
  .chunk-title { font-size: 13px; color: #fbbf24; font-weight: bold; margin-bottom: 8px; }
  .line { padding: 6px 0 6px 56px; position: relative; border-top: 1px dashed #334155; }
  .line .who { position: absolute; left: 0; top: 6px; font-weight: bold; width: 52px; font-size: 13px; }
  .line.driver .who { color: #60a5fa; }
  .line.occ .who { color: #fb923c; }
  .bogie-unit { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
  .bogie-unit.selected { border-color: #3b82f6; background: #1d4ed8; color: white; }
  .bogie-unit.isolated { border-color: #fbbf24; background: #78350f; color: #fbbf24; }
  .progress { font-size: 13px; color: #94a3b8; margin-bottom: 8px; text-align: center; }
</style>
</head>
<body>

<div id="cms" class="cms-area">
  <div id="master-fault-lamp" title="總故障燈（白=正常 / 黃=撒砂或電韌1/4 / 紅=EB或牽引安全迴路或電韌1/2）" style="position:absolute; top:4px; right:10px; z-index:2100; display:flex; flex-direction:row; align-items:center; gap:4px; font-family:Consolas,monospace; pointer-events:none;">
    <span style="font-size:9px; color:#94a3b8; letter-spacing:1px;">總故障燈</span>
    <span id="mfl-light" style="width:18px; height:18px; border-radius:50%; background:#e5e7eb; border:2px solid #94a3b8; box-shadow:0 0 8px #e5e7eb;"></span>
  </div>
  <div class="cms-screen">
    <div id="p-home" class="cms-page active">
      <div class="cms-layout">
        <div class="cms-main" style="display: flex; gap: 15px; align-items: center;">
          <div style="display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #94a3b8; min-width: 80px; border-right: 1px solid #334155; padding-right: 10px;">
            <span id="cms-time">08:00:00</span>
            <span style="color: #4ade80; font-weight: bold; font-size: 16px;">0 <small>km/h</small></span>
            <span id="cms-train-num" style="color: #fff;">101</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div id="cms-gear" class="cms-gear-display">HB</div>
            <div id="btn-mirror-reset" class="nav-btn" style="width: 72px; padding: 4px; font-size: 10px;" onclick="handleCMSClick('後視鏡重置')">後視鏡重置</div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr; gap: 6px;">
            <div id="cms-t" class="cms-icon active-t" style="display:none;">T</div>
            <div id="cms-p" class="cms-icon active-t">弓</div>
            <div id="cms-380v" class="cms-icon v380-normal" style="flex-direction:column; gap:0; line-height:1;" title="380V 供電狀態（白=正常 / 黃=動力問題）"><span style="font-size:18px;">⚡</span><span style="font-size:8px;">380V</span></div>
          </div>
          <div id="atp-hmi" class="atp-hmi">
            <div id="atp-limit" class="atp-limit">20</div>
            <div style="font-size: 11px;">ATP V-MAX</div>
          </div>
        </div>
        <div class="cms-train-col" style="border: 1px solid #334155; padding: 6px; background: #111827; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <!-- 重新設計的 5 節車廂圖示 -->
          <div id="train-graphic" style="position: relative; width: 120px; height: 230px; margin-right: 16px; background: #000; border: 2px solid #475569; display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 12px;">
            <!-- M1 (Motor) -->
            <div class="train-car" style="height: 42px; border: 1px solid #64748b; position: relative; border-radius: 10px 10px 4px 4px; background: #1e293b;">
              <div id="t-m1-1" class="cms-icon active-t" style="position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; font-size: 9px; border-width: 1px;">T</div>
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: bold; color: #fff;">M1</div>
              <div id="t-m1-2" class="cms-icon active-t" style="position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; font-size: 9px; border-width: 1px;">T</div>
              <div class="door-box" id="d-m1l" style="position: absolute; left: 4px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px;"></div>
              <div class="door-box" id="d-m1r" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px;"></div>
              <div id="bogie-status-m1" style="position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #ef4444; font-weight: bold; font-size: 10px; background: #000; padding: 0 2px;"></div>
            </div>
            <!-- M2 (Trailer w/ Doors) -->
            <div class="train-car" style="height: 40px; border: 1px solid #64748b; position: relative; border-radius: 4px; background: #1e293b;">
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: bold; color: #fff;">M2</div>
              <div class="door-box" id="d-m2l" style="position: absolute; left: 4px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px;"></div>
              <div class="door-box" id="d-m2r" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px;"></div>
            </div>
            <!-- M3 (Trailer Bogie, No Doors) -->
            <div class="train-car" style="height: 38px; border: 1px solid #475569; position: relative; border-radius: 4px; background: #0f172a; border-style: dashed;">
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: bold; color: #64748b;">M3</div>
              <div id="bogie-status-m3" style="position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #ef4444; font-weight: bold; font-size: 10px; background: #000; padding: 0 2px;"></div>
            </div>
            <!-- M4 (Trailer w/ Doors) -->
            <div class="train-car" style="height: 40px; border: 1px solid #64748b; position: relative; border-radius: 4px; background: #1e293b;">
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: bold; color: #fff;">M4</div>
              <div class="door-box" id="d-m4l" style="position: absolute; left: 4px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px;"></div>
              <div class="door-box" id="d-m4r" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px;"></div>
            </div>
            <!-- M5 (Motor) -->
            <div class="train-car" style="height: 42px; border: 1px solid #64748b; position: relative; border-radius: 4px 4px 10px 10px; background: #1e293b;">
              <div id="t-m5-1" class="cms-icon active-t" style="position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; font-size: 9px; border-width: 1px;">T</div>
              <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 11px; font-weight: bold; color: #fff;">M5</div>
              <div id="t-m5-2" class="cms-icon active-t" style="position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 14px; height: 14px; font-size: 9px; border-width: 1px;">T</div>
              <div class="door-box" id="d-m5l" style="position: absolute; left: 4px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px;"></div>
              <div class="door-box" id="d-m5r" style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px;"></div>
              <div id="bogie-status-m5" style="position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #ef4444; font-weight: bold; font-size: 10px; background: #000; padding: 0 2px;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="p-settings" class="cms-page"><h3>設定 (SETTINGS)</h3><button style="width: 150px; font-size: 13px;">CMS 螢幕亮度</button></div>
    <div id="p-monitor" class="cms-page"><h3>監視 (MONITOR)</h3><div class="row"><button class="secondary">TCMS</button><button class="secondary">電源</button><button class="secondary">容量</button></div></div>
    <div id="p-propulsion" class="cms-page"><h3>控制 > 推進</h3><div class="row"><button id="btn-tcu-reset" style="background:#334155;" onclick="handleCMSClick('TCU錯誤復位')">TCU 錯誤復位</button><button id="btn-flange-lub" style="background:#334155;" onclick="toggleFlangeLub()">輪緣潤滑裝置</button></div></div>
    <div id="p-ac" class="cms-page"><h3>控制 > 客室空調</h3><div class="row">
        <button id="btn-ac-off" style="background:#475569;" onclick="toggleACOff()">空調關閉</button>
        <button class="secondary">溫度設定</button>
        <button id="btn-ac-reset" style="background:#334155;" onclick="handleCMSClick('空調重置')">空調重置</button>
      </div></div>
    <div id="p-door" class="cms-page"><h3>控制 > 車門</h3><div class="row"><button id="btn-door-open" style="background:#334155;" onclick="handleCMSClick('車門全開')">車門全開</button><button id="btn-door-close" style="background:#334155;" onclick="handleCMSClick('車門全關')">車門全關</button></div></div>
    <div id="p-brake" class="cms-page"><h3>控制 > 煞車</h3>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
        <div style="display: flex; align-items: center; gap: 20px;">
          <button class="secondary" style="min-width:60px;" onclick="cycleBogie(-1)">◀</button>
          <div style="display: flex; gap: 10px;">
            <div id="bogie-M1" class="bogie-unit selected">M1</div>
            <div id="bogie-M3" class="bogie-unit">M3</div>
            <div id="bogie-M5" class="bogie-unit">M5</div>
          </div>
          <button class="secondary" style="min-width:60px;" onclick="cycleBogie(1)">▶</button>
        </div>
        <button id="btn-bogie-isolate" style="width: 200px; background:#334155;" onclick="handleCMSClick('隔離轉向架')">隔離轉向架</button>
      </div></div>
    <div id="p-diag" class="cms-page"><h3>診斷 (DIAGNOSTICS)</h3><div id="diag-content" style="color:#ef4444; font-size: 14px; line-height: 1.4; font-weight: bold;">無主動故障紀錄</div></div>
  </div>
  <div class="cms-nav-container">
    <div id="sub-nav-control" class="cms-sub-nav"><div id="btn-sub-propulsion" class="sub-nav-btn" onclick="switchCMSTab('propulsion')">推進</div><div id="btn-sub-ac" class="sub-nav-btn" onclick="switchCMSTab('ac')">空調</div><div id="btn-sub-door" class="sub-nav-btn" onclick="switchCMSTab('door')">車門</div><div id="btn-sub-brake" class="sub-nav-btn" onclick="switchCMSTab('brake')">煞車</div></div>
    <div id="sub-nav-monitor" class="cms-sub-nav"><div class="sub-nav-btn">TCMS</div><div class="sub-nav-btn">電源</div><div class="sub-nav-btn">容量</div></div>
    <div class="cms-main-nav">
      <div class="nav-btn" onclick="toggleSubNav('settings')">設定</div>
      <div id="nav-monitor" class="nav-btn" onclick="toggleSubNav('monitor')">監視</div>
      <div id="nav-control" class="nav-btn" onclick="toggleSubNav('control')">控制</div>
      <div id="nav-diag" class="nav-btn" onclick="switchCMSTab('diag')">診斷</div>
      <div id="nav-home" class="nav-btn active" onclick="switchCMSTab('home')">首頁</div>
    </div>
  </div>
</div>

<div class="main-content">
  <h1>淡海輕軌正線無線電練習</h1>
  <div id="emergency-panel" class="emergency-panel" style="display: none;">
    <div style="color: #fca5a5; font-size: 12px; margin-bottom: 8px; font-weight: bold;">應急實體面板</div>
    <div id="em-btns" class="em-btn-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
  </div>
  <div class="card">
    <h2>① 運轉設定</h2>
    <div class="row">
      <div><label>車號</label><input id="trainId" type="text" value="101" maxlength="4" inputmode="numeric"></div>
      <div><label>練習情境</label><select id="scenario">
        <option value="normal">正常運轉</option><option value="random_fault">隨機故障排除 (故排)</option><option value="clear">異常處理 (清車)</option><option value="delay_intersection">未能通過路口 (紅燈)</option>
        <optgroup label="故障排除 (故排)">
          <option value="fault_traction_tcu">牽引-CMS T字燈號消失(TCU離線)</option><option value="fault_traction_redlight">牽引-無牽引動力,總故障燈亮紅燈</option><option value="fault_traction_380v">牽引-380V跳脫(24V離線)</option><option value="fault_brake_err">煞車-轉向架ERR(E1,隔離)</option><option value="fault_brake_se">煞車-轉向架SE(隨機單一/全部)</option><option value="fault_brake_2plus">煞車-兩組以上ERR(降弓重開機)</option><option value="fault_power">供電系統故障</option><option value="fault_door">車門系統故障</option><option value="fault_speed">輔助速限裝置故障</option><option value="fault_ac">空調系統故障</option><option value="fault_restart">清車重開機</option>
        </optgroup>
        <optgroup label="營運情境">
          <option value="scenario_point">轉轍器手動扳轉</option><option value="scenario_pei">PEI 旅客對講機</option>
        </optgroup></select></div>
    </div>
  </div>
  <div class="card">
    <h2>② 起訖車站</h2>
    <div class="row"><select id="fromArea"></select><select id="fromDetail"></select></div>
    <div class="row"><select id="toArea"></select><select id="toDetail"></select></div>
    <select id="endAction"><option value="continue">換端後繼續發車</option><option value="finish">換端後返回車班</option></select>

<script>
// 站序對照表（上行：V01→V11→V26，下行反向）
const STATION_SEQUENCE = ["V01","V02","V03","V04","V05","V06","V07","V08","V09","V10","V11"];
// 藍海線：V01–V09 共線後，於 V09 分歧 → V28 → V27 → V26（終點）
const BLUE_SEQUENCE    = ["V01","V02","V03","V04","V05","V06","V07","V08","V09","V28","V27","V26"];

function getAdjacentFaultLocation(from, to) {
  // 取得 from 和 to 的站名（去掉月台）
  const getStation = s => s.replace(/ [12]月台.*/, '').trim();
  const fromSt = getStation(from);
  const toSt   = getStation(to);

  // 決定用哪個序列
  let seq = STATION_SEQUENCE;
  if (fromSt === 'V26' || toSt === 'V26' || fromSt === 'V27' || toSt === 'V27' || fromSt === 'V28' || toSt === 'V28') {
    seq = BLUE_SEQUENCE;
  }

  const fi = seq.indexOf(fromSt);
  const ti = seq.indexOf(toSt);

  // 若找不到站序（如路口、機廠），fallback 用原本的描述
  if (fi === -1 || ti === -1) return `${from}往${to}`;

  const direction = ti > fi ? 1 : -1;
  // 從 from 開始往 to 方向，收集途中的站（不含起終點）
  const midStations = [];
  for (let i = fi + direction; i !== ti; i += direction) {
    midStations.push(seq[i]);
  }

  // 加入 from 的下一站（司機員最容易報告的相鄰段）
  const nextSt = seq[fi + direction];
  if (!nextSt) return `${from}往${to}`;

  // 在 from 與 from下一站 之間隨機插入故障，或在中間某站間插入
  const candidates = [];
  // 至少有 from→nextSt 這一段
  candidates.push({ a: fromSt, b: nextSt });
  // 若途中還有其他站，也加入候選
  for (let i = 0; i < midStations.length; i++) {
    const cur = midStations[i];
    const nxt = midStations[i+1] || toSt;
    candidates.push({ a: cur, b: nxt });
  }
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  return `${pick.a}往${pick.b}`;
}

    { type: "final", report: "已完成按壓應急按鈕「列車自動保護 Bypass」，高架段已切換機廠模式，確認列車可移動。請問OCC是否收車回機廠" }
  ]},

    { type: "final", report: "已完成CMS「空調重置」作業，確認空調系統已恢復正常。請問OCC是否持續觀察行駛至端點站" }
  ]},

  ]}
};

let pendingAction = null; let currentChunks = []; let revealed = 0;
let doorSeqStep = 0; // 車門全開全關序列：0=待按全開，1=待按全關
let brakeReleaseStep = 0; // 單一ERR/SE 複合動作：0=待CMS隔離，1=待按煞車解除
let completedActions = new Set();
let activeEmergencyButtons = new Set(); // 已按壓過的應急按鈕，直到重開機才復歸
let currentBogieIdx = 0; // 0:M1, 1:M3, 2:M5
let isACOff = false;
let isFlangeLubOn = false;
let persistentFault = { bogie: null, tag: null, tIndex: null, isolated: false, bogies: null, subtype: null };

function resetFaultState(isRestart) {
  persistentFault = { bogie: null, tag: null, tIndex: null, isolated: false, bogies: null, subtype: null };
  setMasterFaultLamp(null); // 總故障燈歸位白色（正常）
  doorSeqStep = 0;
  brakeReleaseStep = 0;
  // CMS 操作按鈕底色歸位（避免跨情境殘留綠色）
  [['btn-door-open','#334155'],['btn-door-close','#334155'],['btn-tcu-reset','#334155'],['btn-ac-reset','#334155'],['btn-bogie-isolate','#334155'],['btn-mirror-reset','']].forEach(([id,bg]) => { const b = document.getElementById(id); if (b) b.style.background = bg; });
  // 只有執行清車重開機才復歸應急按鈕
  if (isRestart) activeEmergencyButtons.clear();
}

function toggleACOff() {
  isACOff = !isACOff;

function cycleBogie(dir) {
  currentBogieIdx = (currentBogieIdx + dir + 3) % 3;
  const bogies = ['M1', 'M3', 'M5'];
  bogies.forEach((b, i) => {
    const el = document.getElementById('bogie-' + b);
    el.classList.remove('selected');
    if (i === currentBogieIdx) el.classList.add('selected');
  });
}

function toggleSubNav(mainTab) {
  const subNavs = document.querySelectorAll('.cms-sub-nav');
  const mainBtns = document.querySelectorAll('.cms-main-nav .nav-btn');
  subNavs.forEach(s => s.classList.remove('active'));
  mainBtns.forEach(b => b.classList.remove('active'));
  const targetSub = document.getElementById(`sub-nav-${mainTab}`);
  if (targetSub) { targetSub.classList.add('active'); const btn = Array.from(mainBtns).find(b => b.innerText.includes(mainTab==='control'?'控制':'監視')); if(btn) btn.classList.add('active'); }
  else { switchCMSTab(mainTab); }
}

function switchCMSTab(tab) {
  const pages = document.querySelectorAll('.cms-page');
  const mainBtns = document.querySelectorAll('.cms-main-nav .nav-btn');
  const subBtns = document.querySelectorAll('.sub-nav-btn');
  pages.forEach(p => p.classList.remove('active'));
  const targetPage = document.getElementById(`p-${tab}`); if(targetPage) targetPage.classList.add('active');
  const ctrlTabs = ['propulsion', 'ac', 'door', 'brake'];
  if (!ctrlTabs.includes(tab)) document.getElementById('sub-nav-control').classList.remove('active');
  mainBtns.forEach(b => {
    const map = { home:'首頁', settings:'設定', monitor:'監視', control:'控制', diag:'診斷' };
    b.classList.remove('active'); if (b.innerText === map[tab] || (ctrlTabs.includes(tab) && b.innerText === '控制')) b.classList.add('active');
  });
  subBtns.forEach(b => {
    const map = { propulsion:'推進', ac:'空調', door:'車門', brake:'煞車' };
    b.classList.remove('active'); if (b.innerText === map[tab]) b.classList.add('active');
  });
}

// 總故障燈對照（依故障排除手冊 §16）：白=正常 / 黃=撒砂異常或電韌1/4 / 紅=EB1/2或牽引安全迴路或電韌1/2
// ⚠️ 各情境對應顏色待使用者確認；目前先暫定如下
const MASTER_FAULT_LAMP = {
  fault_brake: 'red',              // E1/EB 緊急煞車作動 → 紅
  fault_traction_redlight: 'red',  // §1.5 無牽引動力，總故障燈亮紅燈 → 紅（待 §1.5 加入後生效）
};
function setMasterFaultLamp(scenario) {
  const palette = { white: ['#e5e7eb', '#94a3b8'], yellow: ['#fbbf24', '#b45309'], red: ['#ef4444', '#b91c1c'] };
  const [fill, border] = palette[MASTER_FAULT_LAMP[scenario] || 'white'];
  const el = document.getElementById('mfl-light');
  if (el) { el.style.background = fill; el.style.borderColor = border; el.style.boxShadow = '0 0 8px ' + fill; }
}

function updateCMSDisplay(scenario) {
  setMasterFaultLamp(scenario);
  const gear = document.getElementById("cms-gear");
  const diag = document.getElementById("diag-content");
  const navDiag = document.getElementById("nav-diag");
  gear.innerText = "HB"; gear.className = "cms-gear-display";
  document.getElementById("atp-hmi").className = "atp-hmi"; document.getElementById("atp-limit").innerText = "20";
  ["cms-t","cms-p"].forEach(id => document.getElementById(id).className = "cms-icon active-t");
  document.getElementById("cms-380v").className = "cms-icon v380-normal"; // 380V 預設白燈
  diag.innerText = "無主動故障紀錄"; navDiag.classList.remove('alert');
  document.querySelectorAll(".door-box").forEach(box => box.className = "door-box");
  document.querySelectorAll(".bogie-unit").forEach(u => u.classList.remove('isolated'));
  
  // 重置列車圖示狀態
  ["t-m1-1","t-m1-2","t-m5-1","t-m5-2"].forEach(id => document.getElementById(id).className = "cms-icon active-t");
  ["m1","m3","m5"].forEach(b => document.getElementById(`bogie-status-${b}`).innerText = "");

  if (scenario === "fault_traction_tcu") {
    gear.innerText = "E1"; gear.className = "cms-gear-display fault";
    document.getElementById("cms-t").className = "cms-icon fault";
    document.getElementById("t-m1-1").className = "cms-icon inactive";
  }
  else if (scenario === "fault_traction_redlight") {
    gear.innerText = "E1"; gear.className = "cms-gear-display fault";
    diag.innerText = "無牽引動力，總故障燈紅燈（牽引安全迴路作動）"; navDiag.classList.add('alert');
  }
  else if (scenario === "fault_traction_380v") {
    gear.innerText = "E1"; gear.className = "cms-gear-display fault";
    document.getElementById("cms-380v").className = "cms-icon v380-fault"; // 動力問題 → 黃燈
    diag.innerText = "380V跳脫、24V離線，列車無法移動"; navDiag.classList.add('alert');
  }
  else if (scenario === "fault_brake") {
    // 保險：若未由 buildPoints 注入才惰性給單一 ERR
    if (!persistentFault.subtype) {
      persistentFault.subtype = 'err1';
      persistentFault.bogie = ["m1","m3","m5"][Math.floor(Math.random()*3)];
      persistentFault.bogies = [persistentFault.bogie];
      persistentFault.tag = "ERR";
    }
    const single = persistentFault.subtype === 'err1' || persistentFault.subtype === 'se1';
    const gearText = persistentFault.tag === 'SE' ? 'SE' : 'E1';
    if (single && persistentFault.isolated) {
      // 已隔離：列車回復 HB 可移動，該轉向架標籤持續顯示（直到重開機）
      gear.innerText = "HB"; gear.className = "cms-gear-display";
      document.getElementById("cms-t").className = "cms-icon active-t";
      const bu = document.getElementById('bogie-' + persistentFault.bogie.toUpperCase());
      if (bu) bu.classList.add('isolated');
    } else {
      gear.innerText = gearText; gear.className = "cms-gear-display fault";
      document.getElementById("cms-t").className = "cms-icon fault";
    }
    // 顯示所有故障轉向架標籤（單一=1組；全部SE=3組；兩組ERR=2組）
    (persistentFault.bogies || []).forEach(b => {
      const el = document.getElementById(`bogie-status-${b}`);
      if (el) el.innerText = persistentFault.tag;
    });
  }
  else if (scenario === "fault_power") { document.getElementById("cms-p").className = "cms-icon fault"; }
  else if (scenario === "fault_door") { document.getElementById("d-m2l").className = "door-box offline"; document.getElementById("d-m4l").className = "door-box offline"; }
  else if (scenario === "fault_speed") { document.getElementById("atp-hmi").className = "atp-hmi fault"; document.getElementById("atp-limit").innerText = "E3516"; }
  else if (scenario === "tetra_special") { 
    navDiag.classList.add('alert'); 
    diag.innerText = "ESS1放電電流過大/ESS1電池芯電壓差過大/ESS1電池偵測版異常，電池未跳脫"; 
    document.getElementById("cms-t").className = "cms-icon fault"; 
  }
}

function handleCMSClick(action) {
  // 車門全開全關：須先按「車門全開」再按「車門全關」才算完成
  if (pendingAction === '車門全開全關') {
    if (action === '車門全開' && doorSeqStep === 0) {
      document.getElementById('btn-door-open').style.background = "#10b981";
      doorSeqStep = 1; render(); // 重新渲染以高亮「車門全關」
    } else if (action === '車門全關' && doorSeqStep === 1) {
      document.getElementById('btn-door-close').style.background = "#10b981";
      doorSeqStep = 0; completedActions.add(revealed);
      setTimeout(() => { pendingAction = null; render(); }, 500);
    }
    return;
  }
  if (pendingAction === action || (action === '隔離轉向架' && (pendingAction === '煞車解除' || pendingAction === '隔離並煞車解除'))) {
    if (action === 'TCU錯誤復位') {
      document.getElementById('btn-tcu-reset').style.background = "#10b981";
      setTimeout(() => {
        document.getElementById("cms-t").className = "cms-icon active-t";
        ["t-m1-1","t-m1-2","t-m5-1","t-m5-2"].forEach(id => document.getElementById(id).className = "cms-icon active-t");
        document.getElementById("diag-content").innerText = "無主動故障紀錄"; document.getElementById("nav-diag").classList.remove('alert');
      }, 300);
    }
    if (action === '空調重置') document.getElementById('btn-ac-reset').style.background = "#10b981";
    if (action === '隔離轉向架') { 
      const bNames = ['m1','m3','m5'];
      const selBogie = bNames[currentBogieIdx];
      document.querySelector('.bogie-unit.selected').classList.add('isolated');
      if (selBogie === persistentFault.bogie) {
        // 隔離正確轉向架：標記已隔離 → 列車回復 HB 可移動（ERR 標籤持續顯示直到重開機）
        persistentFault.isolated = true;
        document.getElementById("cms-gear").innerText = "HB";
        document.getElementById("cms-gear").className = "cms-gear-display";
        document.getElementById("cms-t").className = "cms-icon active-t";
        document.getElementById('btn-bogie-isolate').style.background = "#10b981";
        if (pendingAction === '隔離並煞車解除') {
          // 複合動作：隔離完成 → 尚須按應急按鈕「煞車解除」才算完成
          brakeReleaseStep = 1;
          setTimeout(() => render(), 500); // 重繪跳出「煞車解除」紅鈕
        } else {
          completedActions.add(revealed); setTimeout(() => { pendingAction = null; render(); }, 500);
        }
      }
      // 隔離錯誤轉向架：不完成步驟，維持 E1 故障，使用者可切換其他轉向架重試
      return;
    }
    if (action === '後視鏡重置') document.getElementById('btn-mirror-reset').style.background = "#10b981";
    completedActions.add(revealed); setTimeout(() => { pendingAction = null; render(); }, 500);
  } else if (action === '隔離轉向架') {
    document.querySelector('.bogie-unit.selected').classList.toggle('isolated');
  }
}

function handleEmergencyClick(action) {
  if (pendingAction === action || (action === '煞車解除' && pendingAction === '隔離並煞車解除' && brakeReleaseStep === 1)) {
    activeEmergencyButtons.add(action); // 記錄已按壓的應急按鈕
    completedActions.add(revealed);
    // 若是清車重開機按下降級模式，觸發復歸
    if (action === '降級模式') {
      const lastChunk = currentChunks[revealed - 1];
      if (lastChunk && lastChunk.faultKey === 'fault_restart') {
        resetFaultState(true); // 清車重開機：復歸所有應急按鈕
      }
    }
    brakeReleaseStep = 0;
    pendingAction = null;
    render();
  }
}

function updateEmergencyPanel(action) {
  const panel = document.getElementById('emergency-panel');
  if (!action) { panel.style.display = "none"; return; }
  panel.style.display = "block";
  const buttons = ["列車自動保護 Bypass", "煞車解除", "集電弓降弓 HV OFF", "上下車門", "降級模式", "ATP重置"];
  document.getElementById('em-btns').innerHTML = buttons.map(b => {
    const isTarget  = b === action;
    const isUsed    = activeEmergencyButtons.has(b) && !isTarget;
    const cssClass  = isTarget ? 'highlight' : (isUsed ? 'used' : '');
    const clickable = isTarget && !activeEmergencyButtons.has(b);
    return `<div class="em-btn ${cssClass}" ${clickable ? `onclick="handleEmergencyClick('${b}')"` : ''}>${b}${isUsed ? ' ✓' : ''}</div>`;
  }).join("");
}

function addMinutesToTime(timeStr, mins) {
  const [h, m] = timeStr.split(':').map(Number);
  const date = new Date(); date.setHours(h, m + mins);
  return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
}

function buildPoints(fA, fD, tA, tD, depTime, scenario, endAction) {
  let pts = [];
  function getTravelTime(f, t) {
    if ((f.includes("V01")&&t.includes("V11")) || (f.includes("V11")&&t.includes("V01"))) return 23;
    if (f.includes("V01")&&t.includes("V26")) return 27; if (f.includes("V26")&&t.includes("V01")) return 28;
    return (f.includes("V26")||t.includes("V26")) ? 28 : 23;
  }
  let legs = [];
  if ((fD.includes("V11")||fD.includes("1-0")||fD.includes("2-0")) && tD.includes("V26")) legs = [{f:fD, t:"V01 2月台"}, {f:"V01 2月台", t:tD}];
  else if (fD.includes("V26") && tD.includes("V11")) legs = [{f:fD, t:"V01 1月台"}, {f:"V01 1月台", t:tD}];
  else legs = [{f:fD, t:tD}];

  let runningTime = depTime;
  let faultDone = false; // 故障一旦介入即中斷行程（只注入一次、不接正常終點）
  for (let i = 0; i < legs.length; i++) {
    const leg = legs[i]; const r = ROUTES_MAP[`${leg.f}-${leg.t}`] || "無路徑";
    let curPt = null;
    if (i === 0) {
      if (leg.f.includes("1-0")) curPt = { loc: leg.f, report: "已完成車底車外巡視，做好動車前準備", _isBackupDeparture10: true };
      else if (leg.f.includes("2-0")) curPt = { loc: leg.f, report: "已完成交接做好動車前準備", _isBackupDeparture20: true };
      else if (fA === "depot") curPt = { loc: leg.f, report: `已停妥${leg.f}，做好動車前準備`, _isDepotDeparture: true };
      else { let act = leg.f.includes("V11 2月台") ? "勤務交接" : "換端"; curPt = { loc: leg.f, report: `已完成${act}，接收建議路徑${r}，確認前方號誌開通，依時刻表${runningTime}發車`, _isChangeEnd: true }; }
    } else { curPt = { loc: leg.f, report: `已完成換端，接收建議路徑${r}，確認前方號誌開通，依時刻表${runningTime}發車`, _isChangeEnd: true }; }
    pts.push(curPt);

    if (scenario === "normal" && leg.t.includes("V01")) pts.push({ _isTetraSpecial: true, loc: "V09 2月台", report: "稍早通過J04路口時，列車牽引動力不足，僅消耗M2儲能電池，M2電池70%，M4電池90%，診斷頁面顯示ESS1放電電流過大/ESS1電池芯電壓差過大/ESS1電池偵測版異常，電池未跳脫" });
    runningTime = addMinutesToTime(runningTime, getTravelTime(leg.f, leg.t) + 6);

    const roll = Math.random();
    if ((scenario === "random_fault" && roll > 0.3) || (scenario.startsWith("fault_"))) {
      const randomPool = ['fault_traction_tcu','fault_brake','fault_power','fault_door','fault_speed','fault_ac','fault_restart'];
      const fKey = scenario.startsWith("fault_") ? scenario : randomPool[Math.floor(Math.random()*randomPool.length)];
      // 隨機決定故障發生於「站內(月台)」或「站間途中」（Q2）
      const atStation = Math.random() < 0.5 && leg.t.includes("月台");
      const faultLoc = atStation ? leg.t : getAdjacentFaultLocation(leg.f, leg.t);
      const isBlue = /V2[678]/.test(leg.f + leg.t + tD);
      if (fKey === 'fault_traction_redlight') {
        // §1.5 無牽引動力，總故障燈亮紅燈：走自訂分支報話（站內/站間 + 收車流程）
        pts.push({ loc: faultLoc, _isTractionRedlight: true, _atStation: atStation, _line: isBlue ? 'blue' : 'green', faultKey: 'fault_traction_redlight' });
      } else if (fKey === 'fault_traction_380v') {
        // §3.4 380V跳脫：隨機兩結局（TCU有效直接觀察 / 無效→降級→重開機→收車）
        pts.push({ loc: faultLoc, _isV380: true, _v380Recovered: Math.random() < 0.5, _line: isBlue ? 'blue' : 'green', faultKey: 'fault_traction_380v' });
      } else if (fKey === 'fault_brake' || fKey.indexOf('fault_brake_') === 0) {
        // 煞車系統故障：站間發生。子類型 err1(單一ERR)/se1(單一SE)/seAll(全部SE)/err2plus(兩組以上ERR)
        let type;
        if (fKey === 'fault_brake_err') type = 'err1';
        else if (fKey === 'fault_brake_2plus') type = 'err2plus';
        else if (fKey === 'fault_brake_se') type = Math.random() < 0.5 ? 'se1' : 'seAll';
        else type = ['err1','se1','seAll','err2plus'][Math.floor(Math.random()*4)]; // 隨機池
        const bpool = ['m1','m3','m5'];
        let bogies;
        if (type === 'seAll') bogies = bpool.slice();
        else if (type === 'err2plus') { bogies = bpool.slice(); bogies.splice(Math.floor(Math.random()*3), 1); } // 隨機 2 組
        else bogies = [bpool[Math.floor(Math.random()*3)]]; // 單一
        const uplink = leg.t.includes('V11') || leg.t.includes('V26');
        persistentFault.bogies = bogies;
        persistentFault.bogie = (type === 'err1' || type === 'se1') ? bogies[0] : null;
        persistentFault.tag = (type === 'se1' || type === 'seAll') ? 'SE' : 'ERR';
        persistentFault.subtype = type;
        // 煞車一律站間發生 → 用站間 loc（不用月台）
        pts.push({ loc: getAdjacentFaultLocation(leg.f, leg.t), _isBrakeScenario: true, _brakeType: type, _bogies: bogies, _isBlue: isBlue, _uplink: uplink, faultKey: 'fault_brake' });
      } else {
        pts.push({ loc: faultLoc, _isFaultScenario: true, _atStation: atStation, faultKey: fKey, faultName: FAULT_DATA[fKey].name, steps: FAULT_DATA[fKey].steps });
      }
      faultDone = true; // 故障已注入 → 中斷行程
    } else if (scenario === "scenario_point") {
      pts.push({ loc: "V09 1月台", _isPointScenario: true, pointId: "EPM100", side: "左位" });
    } else if (scenario === "scenario_pei") {
      pts.push({ loc: getAdjacentFaultLocation(leg.f, leg.t), _isPEIScenario: true });
    } else if (scenario === "delay_intersection") {
      const j = AREAS.intersections.items[Math.floor(Math.random()*18)];
      const jUp = (leg.t.includes("V11")||leg.t.includes("V26"));
      pts.push({ loc: j + (jUp ? '上行' : '下行'), _isDelayScenario: true, isUplink: jUp, report: `稍早於${leg.f}等候旅客上下車，未能通過${j}，待下一輪號誌開通後再通過路口` });
    }
    if (faultDone) break; // 故障已介入 → 不再處理後續 leg
  }
  const finalPt = (tA === "depot") ? { loc: tD, report: `已停妥${tD}${tD.includes("2-0")?"，完成交接":"，Tetra轉G01完成"}`, isFinal: true } : { loc: tD, report: `已完成換端，接收建議路徑${ROUTES_MAP[tD+'-'+fD] || '[路徑號]'}，確認前方號誌開通，依時刻表發車`, isFinal: true };
  if (!faultDone) pts.push(finalPt); // 故障介入時不接正常終點（行程已由收車流程結束）

  return pts;
}

// §1.5 無牽引動力，總故障燈亮紅燈：依「站內(月台)/站間」分支 + 重開機恢復後收車流程
function buildRedlightChunks(trainId, cur) {
  const t = trainId, loc = cur.loc, fk = 'fault_traction_redlight';
  const isBlue = cur._line === 'blue';
  const downstream = (loc.match(/往(V\d+)/) || [])[1] || '下一站';
  const chunks = [];
  // 共同步驟1：回報 + TCU 復位
  chunks.push({ title: '【故排】無牽引動力 總故障燈亮紅燈 - 步驟1', faultKey: fk, requireAction: 'TCU錯誤復位', lines: [
    { who: '司機員', text: `${loc}，${t}車呼叫OCC，列車無牽引動力，CMS總故障燈亮紅燈，已確認T字、車門、供電、ATP無其他異常，目前無法移動，OVER` },
    { who: 'OCC', text: `OCC收到，${t}車，請執行CMS「TCU錯誤復位」，並確認安全煞車已復歸、主控制器離開停機檔，確認列車是否恢復，OVER` },
    { who: '司機員', text: `${t}車收到，執行CMS「TCU錯誤復位」，確認安全煞車已復歸、主控制器離開停機檔，通話完畢。` },
  ]});
  if (cur._atStation) {
    // 分支甲：站內(月台) → 車門全開全關確認牽引力（先全開後全關）
    chunks.push({ title: '【故排】站內處置 - 步驟2 車門全開全關確認牽引力', faultKey: fk, requireAction: '車門全開全關', lines: [
      { who: '司機員', text: `${t}車回報，TCU復位無效，列車仍無牽引動力，OVER` },
      { who: 'OCC', text: `OCC收到，授權${t}車月台側開門，請執行CMS車門全開全關一次後確認有無牽引，OVER` },
      { who: '司機員', text: `${t}車收到，月台側開門，執行CMS車門全開全關一次後確認有無牽引，通話完畢。` },
    ]});
    chunks.push({ title: '【故排】站內處置 - 步驟3 OCC下達清車重開機', faultKey: fk, requireAction: null, lines: [
      { who: '司機員', text: `${t}車回報，已完成CMS車門全開全關，確認仍無牽引，OVER` },
      { who: 'OCC', text: `OCC收到，請${t}車執行清車重開機，完成後回報，OVER` },
      { who: '司機員', text: `${t}車收到，執行清車重開機，通話完畢。` },
    ]});
  } else {
    // 分支乙：路口/站間 → 降級模式移動至下游站
    chunks.push({ title: '【故排】站間處置 - 步驟2 降級模式移動至下游站', faultKey: fk, requireAction: '降級模式', lines: [
      { who: '司機員', text: `${t}車回報，TCU復位無效，列車位於站間無法開門確認，仍無牽引動力，OVER` },
      { who: 'OCC', text: `OCC收到，請${t}車按壓應急按鈕「降級模式」，將列車移動至下游${downstream}，抵達後回報，OVER` },
      { who: '司機員', text: `${t}車收到，按壓應急按鈕「降級模式」移動至下游${downstream}，抵達後回報，通話完畢。` },
    ]});
    chunks.push({ title: '【故排】站間處置 - 步驟3 OCC下達清車重開機', faultKey: fk, requireAction: null, lines: [
      { who: '司機員', text: `${t}車回報，已以降級模式行駛至${downstream}，OVER` },
      { who: 'OCC', text: `OCC收到，請${t}車執行清車重開機，完成後回報，OVER` },
      { who: '司機員', text: `${t}車收到，執行清車重開機，通話完畢。` },
    ]});
  }
  // 步驟4：重開機恢復（恢復後總故障燈轉白）
  chunks.push({ title: '【故排】步驟4 重開機恢復', faultKey: 'recovered', requireAction: null, lines: [
    { who: '司機員', text: `${t}車回報，已完成清車重開機，列車恢復正常，OVER` },
    { who: 'OCC', text: `OCC收到，${t}車重開機後不載客，請行駛至端點站換端後續行收車，OVER` },
  ]});
  // 收車流程（與 §3.4 共用；綠線往V11→2-0交接、藍線往V26→備用車）
  buildPickupChunks(t, isBlue).forEach(c => chunks.push(c));
  return chunks;
}

// 重開機/故排恢復後的收車尾段（所有故排共用；收車點只有 V11綠→2-0、V26藍→換藍備）
function buildPickupChunks(t, isBlue) {
  const chunks = [];
  if (isBlue) {
    // 藍線：無清除路徑步驟（目的地本就是 V26 1月台）；V26 1月台清車換端「故障車停此」→ 轉乘 V26 2月台藍海備用車
    chunks.push({ title: '【收車】V26清車換端', faultKey: 'recovered', lines: [
      { who: 'OCC', text: `OCC呼叫${t}車，請${t}車稍後抵達V26 1月台執行清車換端，完成後回報，OVER` },
      { who: '司機員', text: `V26 1月台，${t}車呼叫OCC，已完成清車換端，清車人數0人，OVER` },
    ]});
    chunks.push({ title: '【收車】轉乘藍海備用車', faultKey: 'recovered', isFinal: true, lines: [
      { who: 'OCC', text: `OCC收到，請${t}車攜帶原車裝備至V26 2月台藍海備用車，開啟載客模式後回報，OVER` },
      { who: '司機員', text: `V26 2月台，${t}車呼叫OCC，已攜帶原車裝備至藍海備用車並開啟載客模式，通話完畢。` },
    ]});
  } else {
    // 綠線：V10 1月台手動清除路徑 → 變更目的地 V11 2月台執行清車 → 臨時駐車位置 2-0 交接
    chunks.push({ title: '【收車】手動清除路徑', faultKey: 'recovered', lines: [
      { who: 'OCC', text: `OCC呼叫${t}車，請${t}車行駛至V10 1月台，抵達後手動清除路徑回報，OVER` },
      { who: '司機員', text: `V10 1月台，${t}車呼叫OCC，已完成手動清除路徑，OVER` },
    ]});
    chunks.push({ title: '【收車】變更目的地・清車', faultKey: 'recovered', lines: [
      { who: 'OCC', text: `OCC收到，請${t}車變更目的地為V11 2月台，抵達後執行清車，完成後回報，OVER` },
      { who: '司機員', text: `V11 2月台，${t}車呼叫OCC，已完成清車，清車人數0人，OVER` },
    ]});
    chunks.push({ title: '【收車】勤務交接', faultKey: 'recovered', isFinal: true, lines: [
      { who: 'OCC', text: `OCC收到，請${t}車確認前方號誌開通後，行駛至臨時駐車位置2-0完成勤務交接後回報，OVER` },
      { who: '司機員', text: `臨時駐車位置2-0，${t}車呼叫OCC，已完成勤務交接，通話完畢。` },
    ]});
  }
  return chunks;
}

// §3.4 380V跳脫(24V離線)：隨機兩結局（TCU有效→繼續觀察 / TCU無效→降級→復歸→再降級→端點站清車重開機→收車）
function buildV380Chunks(trainId, cur) {
  const t = trainId, loc = cur.loc, fk = 'fault_traction_380v';
  const isBlue = cur._line === 'blue';
  const chunks = [];
  // 步驟1：回報 + TCU 復位
  chunks.push({ title: '【故排】380V跳脫(24V離線) - 步驟1', faultKey: fk, requireAction: 'TCU錯誤復位', lines: [
    { who: '司機員', text: `${loc}，${t}車呼叫OCC，列車無牽引動力，CMS顯示380V亮黃燈，監視電源頁面顯示M1 380反灰、M1 24V反灰，目前無法移動，OVER` },
    { who: 'OCC', text: `OCC收到，${t}車，請執行CMS「TCU錯誤復位」，確認列車是否恢復，OVER` },
    { who: '司機員', text: `${t}車收到，執行CMS「TCU錯誤復位」，通話完畢。` },
  ]});
  if (cur._v380Recovered) {
    // 結局A：TCU 復位有效，可動車
    chunks.push({ title: '【故排】TCU復位有效', faultKey: 'recovered', isFinal: true, lines: [
      { who: '司機員', text: `${t}車回報，已執行TCU錯誤復位，列車恢復正常可移動，OVER` },
      { who: 'OCC', text: `OCC收到，${t}車，請繼續行駛，持續留意觀察，通話完畢。` },
    ]});
    return chunks;
  }
  // 結局B：TCU 無效 → 降級模式（高架切機廠）
  chunks.push({ title: '【故排】TCU無效 - 步驟2 降級模式', faultKey: fk, requireAction: '降級模式', lines: [
    { who: '司機員', text: `${t}車回報，TCU復位無效，列車仍無法移動，OVER` },
    { who: 'OCC', text: `OCC收到，請${t}車按壓應急按鈕「降級模式」，高架段切換機廠模式，嘗試移動列車，OVER` },
    { who: '司機員', text: `${t}車收到，按壓應急按鈕「降級模式」，高架段切換機廠模式，通話完畢。` },
  ]});
  // 步驟3：降級可動 → OCC 指示抵下游站復歸降級模式
  chunks.push({ title: '【故排】步驟3 降級可移動 → 下游站復歸', faultKey: fk, requireAction: null, lines: [
    { who: '司機員', text: `${t}車回報，已按壓降級模式並切換機廠模式，列車可移動，OVER` },
    { who: 'OCC', text: `OCC收到，請${t}車抵達下游車站後復歸降級模式，OVER` },
    { who: '司機員', text: `${t}車收到，抵達下游車站後復歸降級模式，通話完畢。` },
  ]});
  // 步驟4：復歸後無法移動 → 再按降級 + 端點站清車重開機
  chunks.push({ title: '【故排】步驟4 復歸無效 → 端點站清車重開機', faultKey: fk, requireAction: null, lines: [
    { who: '司機員', text: `${t}車回報，已復歸降級模式，列車無法移動，OVER` },
    { who: 'OCC', text: `OCC收到，請${t}車再次按壓降級模式，並於端點站清車重開機，OVER` },
    { who: '司機員', text: `${t}車收到，再次按壓降級模式，於端點站清車重開機，通話完畢。` },
  ]});
  // 步驟5：端點站重開機恢復 → 走完整收車流程（2026-07-07 改：所有故障清車一律走完整流程）
  chunks.push({ title: '【故排】步驟5 端點站重開機恢復', faultKey: 'recovered', requireAction: null, lines: [
    { who: '司機員', text: `${t}車回報，已於端點站完成清車重開機，列車恢復正常，OVER` },
    { who: 'OCC', text: `OCC收到，${t}車重開機後不載客，續行收車，OVER` },
  ]});
  // 收車尾段（完整流程，與 §1.5、煞車共用）
  buildPickupChunks(t, isBlue).forEach(c => chunks.push(c));
  return chunks;
}

// 煞車系統故障：單一轉向架 ERR/SE→CMS隔離；全部SE→重置安全煞車+降弓重開機；兩組以上ERR→降弓重開機。皆接完整收車。
function buildBrakeChunks(trainId, cur) {
  const t = trainId, loc = cur.loc, fk = 'fault_brake';
  const isBlue = cur._isBlue;
  const downlink = !cur._uplink; // 下行＝往 V01
  const bogies = (cur._bogies || []).map(b => b.toUpperCase()).join('、');
  const type = cur._brakeType;
  const chunks = [];

  if (type === 'err1' || type === 'se1') {
    // 單一轉向架 ERR / SE → CMS 隔離轉向架（司機員於隔離時自按煞車解除）
    const tag = type === 'se1' ? 'SE' : 'ERR';
    const cmsShow = type === 'se1' ? 'SE' : 'E1';
    // 複合動作：CMS 隔離轉向架 → 再按應急按鈕「煞車解除」，兩動作同一步都完成才算故排完成
    chunks.push({ title: `【故排】煞車-單一轉向架${tag} 隔離＋煞車解除`, faultKey: fk, requireAction: '隔離並煞車解除', lines: [
      { who: '司機員', text: `${loc}，${t}車呼叫OCC，目前${bogies}轉向架${tag}，CMS顯示${cmsShow}，列車無法移動，OVER` },
      { who: 'OCC', text: `OCC收到，${t}車，請執行CMS「隔離轉向架」作業，確認列車是否恢復，OVER` },
      { who: '司機員', text: `${t}車收到，執行CMS「隔離轉向架」作業，通話完畢。` },
    ]});
    chunks.push({ title: '【故排】煞車 可移動', faultKey: 'recovered', requireAction: null, lines: [
      { who: '司機員', text: `${t}車回報，已完成隔離${bogies}轉向架並按壓煞車解除，列車可移動，OVER` },
    ]});
    if (downlink) {
      // 下行尚未重開機 → 先到 V02 2月台，再至 V01 清車不載客重開機，發車後接收車尾段
      chunks.push({ title: '【故排】煞車 下行 續行V02', faultKey: 'recovered', requireAction: null, lines: [
        { who: 'OCC', text: `OCC收到，請${t}車繼續行駛，抵達V02 2月台回報，OVER` },
        { who: '司機員', text: `V02 2月台，${t}車呼叫OCC，已抵達，OVER` },
      ]});
      chunks.push({ title: '【故排】煞車 下行 V01清車不載客重開機', faultKey: 'recovered', requireAction: null, lines: [
        { who: 'OCC', text: `OCC收到，請${t}車抵達V01後執行清車不載客重開機作業，完成後回報，OVER` },
        { who: '司機員', text: `V01，${t}車呼叫OCC，已完成清車不載客重開機，列車恢復正常，OVER` },
      ]});
      chunks.push({ title: '【故排】煞車 下行 發車', faultKey: 'recovered', requireAction: null, lines: [
        { who: 'OCC', text: `OCC收到，請${t}車確認前方號誌開通後依時刻表發車，續行收車，OVER` },
      ]});
    }
    buildPickupChunks(t, isBlue).forEach(c => chunks.push(c));
    return chunks;
  }

  if (type === 'seAll') {
    // 全部轉向架 SE：重置安全煞車 → 無效 → 播廣播 + 降弓就地重開機
    chunks.push({ title: '【故排】煞車-全部SE 步驟1 重置安全煞車', faultKey: fk, requireAction: null, lines: [
      { who: '司機員', text: `${loc}，${t}車呼叫OCC，目前全部轉向架SE、檔位顯示SE，列車無法移動，OVER` },
      { who: 'OCC', text: `OCC收到，${t}車，請執行重置安全煞車，確認列車是否恢復，OVER` },
      { who: '司機員', text: `${t}車收到，執行重置安全煞車，通話完畢。` },
    ]});
    chunks.push({ title: '【故排】煞車-全部SE 步驟2 降弓重開機', faultKey: fk, requireAction: null, lines: [
      { who: '司機員', text: `${t}車回報，已執行重置安全煞車，仍無法移動，OVER` },
      { who: 'OCC', text: `OCC收到，請${t}車播放預錄廣播告知旅客相關資訊後，執行降弓重開機，確認列車是否恢復，OVER` },
      { who: '司機員', text: `${t}車收到，播放預錄廣播告知旅客後執行降弓重開機，通話完畢。` },
    ]});
  } else {
    // 兩組以上轉向架 ERR：直接播廣播 + 降弓就地重開機
    chunks.push({ title: '【故排】煞車-兩組以上ERR 步驟1 降弓重開機', faultKey: fk, requireAction: null, lines: [
      { who: '司機員', text: `${loc}，${t}車呼叫OCC，目前${bogies}轉向架ERR，CMS顯示E1，列車無法移動，OVER` },
      { who: 'OCC', text: `OCC收到，${t}車，請播放預錄廣播告知旅客相關資訊後，執行降弓重開機，確認列車是否恢復，OVER` },
      { who: '司機員', text: `${t}車收到，播放預錄廣播告知旅客後執行降弓重開機，通話完畢。` },
    ]});
  }
  // 就地降弓重開機恢復 → 收車（已重開機，端點不再重開機；下行至 V01 僅正常換端＝無台詞）
  chunks.push({ title: '【故排】降弓重開機恢復', faultKey: 'recovered', requireAction: null, lines: [
    { who: '司機員', text: `${t}車回報，已完成降弓重開機，列車恢復正常、可移動，OVER` },
    { who: 'OCC', text: `OCC收到，${t}車重開機後不載客，續行收車，OVER` },
  ]});
  buildPickupChunks(t, isBlue).forEach(c => chunks.push(c));
  return chunks;
}

function makeChunks(trainId, pts) {
  const chunks = [];
  pts.forEach((cur, i) => {
    const nxt = pts[i+1];
    if (cur._isTetraSpecial) {
      const call = `${cur.loc}，${trainId}車呼叫OCC，${cur.report}，OVER`;
      const reply = `OCC收到，${cur.loc}${trainId}車回報，${cur.report}，請${trainId}車執行TCU錯誤復位後持續留意觀察，通話完畢。`;
      const repeat = `${trainId}車收到，執行TCU錯誤復位後持續留意觀察，通話完畢。`;
      chunks.push({ title: "【無線電】Tetra 故障回報", lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }, { who: "司機員", text: repeat }], requireAction: "TCU錯誤復位", faultKey: "tetra_special" });
    } else if (cur._isPointScenario) {
      const occCall = `OCC呼叫${cur.loc}${trainId}車，請${trainId}車司機員攜帶轉轍桿、Tetra、車間門鑰匙至轉轍器${cur.pointId}前，將轉轍器${cur.pointId}扳轉至${cur.side}定位後回報，OVER`;
      const driverRepeat = `${trainId}車收到，攜帶轉轍桿、Tetra、車間門鑰匙至轉轍器${cur.pointId}前，將轉轍器${cur.pointId}扳轉至${cur.side}定位後回報，通話完畢。`;
      chunks.push({ title: "【營運】轉轍器手動扳轉 - 指示", lines: [{ who: "OCC", text: occCall }, { who: "司機員", text: driverRepeat }] });
      
      const driverReport = `${cur.loc}${trainId}車呼叫OCC，已將${cur.pointId}扳轉至${cur.side}定位，確認軌尖密合，OVER`;
      const occReply = `OCC收到，已確認${cur.pointId}扳轉至${cur.side}定位，確認軌尖密合，請${trainId}車司機員返回列車，稍後可冒前方雙燈，依路口四燈號誌通過，沿途請確認轉轍器方位正確後再慢速通過，通話完畢。`;
      chunks.push({ title: "【營運】轉轍器手動扳轉 - 完成", lines: [{ who: "司機員", text: driverReport }, { who: "OCC", text: occReply }] });
    } else if (cur._isPEIScenario) {
      const call = `${cur.loc}，${trainId}車呼叫OCC，稍早旅客按壓 PEI，通報有旅客身體不適，請求於下一站停車並由救護人員協助，OVER`;
      const reply = `OCC收到，${trainId}車，請於下一站停車待命，已通知相關人員，OVER`;
      const repeat = `${trainId}車收到，於下一站停車待命，通話完畢。`;
      chunks.push({ title: "【營運】PEI 旅客對講機", lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }, { who: "司機員", text: repeat }] });
    } else if (cur._isTractionRedlight) {
      buildRedlightChunks(trainId, cur).forEach(c => chunks.push(c));
    } else if (cur._isV380) {
      buildV380Chunks(trainId, cur).forEach(c => chunks.push(c));
    } else if (cur._isBrakeScenario) {
      buildBrakeChunks(trainId, cur).forEach(c => chunks.push(c));
    } else if (cur._isFaultScenario) {
      cur.steps.forEach((s, idx) => {
        const call = `${cur.loc}，${trainId}車呼叫OCC，${s.report}，OVER`;
        if (s.type === "final") {
          const reply = `OCC收到，${trainId}車回報，${s.report.replace(/。請問.*$/,"")}，准許${trainId}車發車回報之要求，通話完畢。`;
          chunks.push({ title: `【故排】${cur.faultName} - 步驟 ${idx+1}`, lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }], requireAction: null, faultKey: cur.faultKey });
        } else {
          const act = s.type === 'cms' ? `執行CMS「${s.action}」作業` : `按壓應急按鈕「${s.action}」`;
          const reply = `OCC收到，${trainId}車，請${act}，確認列車是否恢復，OVER`;
          const repeat = `${trainId}車收到，${act}，通話完畢。`;
          chunks.push({ title: `【故排】${cur.faultName} - 步驟 ${idx+1}`, lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }, { who: "司機員", text: repeat }], requireAction: s.action, faultKey: cur.faultKey });
        }
      });
    } else if (cur._isDelayScenario) {
      const call = `${cur.loc}，${trainId}車呼叫OCC，${cur.report}，OVER`;
      const reply = `OCC收到，${cur.loc}${trainId}車回報，${cur.report}，請待下一輪號誌開通，確認路口淨空後通過，OVER`;
      const repeat = `${trainId}車收到，待下一輪號誌開通，確認路口淨空後通過，通話完畢。`;
      chunks.push({ title: `【延誤】${cur.loc}紅燈`, lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }, { who: "司機員", text: repeat }] });
    } else {
      const call = `${cur.loc}，${trainId}車呼叫OCC，${cur.report}，OVER`;
      const reply = `OCC收到，${cur.loc}${trainId}車回報，${cur.report}，通話完畢。`;
      chunks.push({ title: cur.isFinal ? "【終點】" : "【起始】", isFinal: cur.isFinal, lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }] });
    }
  });
  return chunks;
}

function render() {
  const box = document.getElementById("result"); if (currentChunks.length === 0) return;
  const lastChunk = currentChunks[revealed - 1];
  if (lastChunk && lastChunk.faultKey) updateCMSDisplay(lastChunk.faultKey);
  const cmsActions = ['TCU錯誤復位', '隔離轉向架', '車門全開全關', '空調重置', '後視鏡重置'];
  pendingAction = (lastChunk && !completedActions.has(revealed)) ? lastChunk.requireAction : null;
  if (pendingAction !== '車門全開全關') doorSeqStep = 0; // 離開車門步驟時重置序列
  if (pendingAction !== '隔離並煞車解除') brakeReleaseStep = 0; // 離開複合步驟時重置
  document.querySelectorAll('.sub-btn, .sub-nav-btn, .nav-btn').forEach(b => b.classList.remove('highlight'));
  if (pendingAction) {
    if (pendingAction === '隔離並煞車解除') {
      if (brakeReleaseStep === 0) {
        // 子步驟0：高亮 CMS 隔離轉向架
        document.getElementById('nav-control').classList.add('alert');
        document.getElementById('btn-sub-brake').classList.add('highlight');
        document.getElementById('btn-bogie-isolate').classList.add('highlight');
        updateEmergencyPanel(null);
      } else {
        // 子步驟1：隔離完成 → 跳出應急按鈕「煞車解除」
        updateEmergencyPanel('煞車解除');
      }
    } else if (cmsActions.includes(pendingAction)) {
      if (pendingAction === 'TCU錯誤復位') { document.getElementById('nav-control').classList.add('alert'); document.getElementById('btn-sub-propulsion').classList.add('highlight'); document.getElementById('btn-tcu-reset').classList.add('highlight'); }
      if (pendingAction === '後視鏡重置') document.getElementById('btn-mirror-reset').classList.add('highlight');
      if (pendingAction === '空調重置') { document.getElementById('nav-control').classList.add('alert'); document.getElementById('btn-sub-ac').classList.add('highlight'); document.getElementById('btn-ac-reset').classList.add('highlight'); }
      if (pendingAction === '隔離轉向架') { document.getElementById('nav-control').classList.add('alert'); document.getElementById('btn-sub-brake').classList.add('highlight'); document.getElementById('btn-bogie-isolate').classList.add('highlight'); }
      if (pendingAction === '車門全開全關') { document.getElementById('nav-control').classList.add('alert'); document.getElementById('btn-sub-door').classList.add('highlight'); document.getElementById(doorSeqStep === 0 ? 'btn-door-open' : 'btn-door-close').classList.add('highlight'); }
      updateEmergencyPanel(null);
    } else updateEmergencyPanel(pendingAction);
  } else updateEmergencyPanel(null);

  const progress = `<div class="progress">已顯示 ${revealed} / ${currentChunks.length} 段</div>`;
  const shown = currentChunks.slice(0, revealed).map(c => `<div class="chunk ${c.isFinal?'final':''}"><div class="chunk-title">${c.title}</div>${c.lines.map(l=>`<div class="line ${l.who==='司機員'?'driver':'occ'}"><span class="who">${l.who}</span><span class="text">${l.text}</span></div>`).join("")}</div>`).join("");
  let nextBtn = (revealed < currentChunks.length) ? `<button id="nextBtn" ${pendingAction ? 'disabled' : ''}>${pendingAction ? '等待執行操作：'+pendingAction : '繼續 — 已完成上段回報'}</button>` : `<button onclick="location.reload()">重新開始</button>`;
  box.innerHTML = `<div class="card"><h2>無線電對話</h2>${progress}${shown}${nextBtn}</div>`;
  const nb = document.getElementById("nextBtn"); if(nb) nb.onclick = () => { revealed++; render(); window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'}); };
}

const fA_el = document.getElementById("fromArea"); const fD_el = document.getElementById("fromDetail");
const tA_el = document.getElementById("toArea"); const tD_el = document.getElementById("toDetail");
const fill = (sel, keys) => sel.innerHTML = keys.map(k => `<option value="${k}">${AREAS[k].label}</option>`).join("");
const fillD = (sel, area) => sel.innerHTML = AREAS[area].items.map(v => `<option value="${v}">${v}</option>`).join("");
fill(fA_el, ["mainline", "blue"]); fill(tA_el, ["mainline", "green", "blue", "depot"]);
fillD(fD_el, fA_el.value); fillD(tD_el, tA_el.value);
fA_el.onchange = () => fillD(fD_el, fA_el.value); tA_el.onchange = () => fillD(tD_el, tA_el.value);

// 視窗比 CMS 設計寬度(640)窄時（手機），整個 CMS 等比例縮小以完整顯示、不裁切；桌機維持原寸置中
function fitCMS() {
  const cms = document.getElementById('cms');
  const DESIGN = 640, H = 335;
  if (window.innerWidth < DESIGN) {
    const s = window.innerWidth / DESIGN;
    Object.assign(cms.style, { width: DESIGN + 'px', maxWidth: 'none', left: '0', right: 'auto', marginLeft: '0', marginRight: '0', transformOrigin: 'top left', transform: 'scale(' + s + ')' });
    document.body.style.paddingTop = Math.ceil(H * s + 10) + 'px';
  } else {
    ['width','maxWidth','left','right','marginLeft','marginRight','transformOrigin','transform'].forEach(k => cms.style[k] = '');
    document.body.style.paddingTop = '';
  }
}
window.addEventListener('resize', fitCMS);
fitCMS();

document.getElementById("genBtn").onclick = () => {
  const tId = document.getElementById("trainId").value || "101";
  const scenario = document.getElementById("scenario").value;
  const depTime = `${String(Math.floor(Math.random()*24)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;
  completedActions.clear();
  activeEmergencyButtons.clear(); // 每次重新產生情境，清空應急按鈕狀態
  resetFaultState(false);
  currentChunks = makeChunks(tId, buildPoints(fA_el.value, fD_el.value, tA_el.value, tD_el.value, depTime, scenario, document.getElementById("endAction").value));
  revealed = 1; render();
};
</script>
