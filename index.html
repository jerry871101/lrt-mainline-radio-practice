<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>淡海輕軌正線無線電練習</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    line-height: 1.65;
    padding: 12px;
    font-size: 15px;
    padding-top: 345px; /* 為固定置頂 CMS 預留空間（高度 335 + 邊距） */
  }
  /* 整個 App 限制最大寬度並置中（640px 才容得下首頁資訊排 + 右側直立列車） */
  .main-content { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 6px 0 14px; text-align: center; color: #60a5fa; }
  .card { background: #1e293b; border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #334155; }
  .card h2 { font-size: 15px; margin: 0 0 10px; color: #93c5fd; border-bottom: 1px solid #334155; padding-bottom: 6px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
  select, button, input { width: 100%; padding: 10px 12px; font-size: 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; margin-bottom: 10px; font-family: inherit; }
  button { background: #2563eb; border-color: #2563eb; color: white; font-weight: bold; cursor: pointer; padding: 13px; font-size: 16px; }
  button:active { background: #1d4ed8; }
  button:disabled { background: #475569; border-color: #475569; opacity: 0.6; cursor: not-allowed; }
  button.secondary { background: #475569; border-color: #475569; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  /* CMS 核心樣式 */
  .cms-area {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2000;
    max-width: 640px; margin-left: auto; margin-right: auto; /* 與 .main-content 同寬置中 */
    background: #000; border-bottom: 4px solid #475569; padding: 12px; height: 335px;
    display: flex; flex-direction: column; gap: 8px; font-family: "Consolas", monospace;
    box-shadow: 0 5px 20px rgba(0,0,0,0.9);
  }
  .cms-screen { flex: 1; background: #000; border: 1px solid #334155; border-radius: 4px; position: relative; overflow: hidden; }
  .cms-page { display: none; height: 100%; padding: 10px; }
  .cms-page.active { display: block; }
  
  .cms-nav-container { display: flex; flex-direction: column; gap: 4px; }
  .cms-sub-nav {
    display: none; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #111827;
    padding: 4px; border-radius: 4px; border: 1px solid #334155;
  }
  .cms-sub-nav.active { display: grid; }
  
  .cms-main-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .nav-btn {
    background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
    color: #94a3b8; border: 2px solid #475569; padding: 10px 2px;
    font-size: 13px; text-align: center; cursor: pointer; border-radius: 6px; font-weight: bold;
    box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,0.1);
    transition: all 0.05s; user-select: none; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #000; background: #0f172a; }
  .nav-btn.active { background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%); color: white; border-color: #60a5fa; box-shadow: 0 1px 0 #000, inset 0 1px 3px rgba(0,0,0,0.5); }
  .nav-btn.alert { animation: blink-yellow 1s infinite; color: #fbbf24; border-color: #fbbf24; }
  
  .sub-nav-btn {
    background: linear-gradient(180deg, #475569 0%, #334155 100%); color: #e2e8f0; border: 1px solid #64748b; padding: 8px 2px;
    font-size: 11px; text-align: center; cursor: pointer; border-radius: 4px; box-shadow: 0 2px 0 #000; transition: all 0.05s; user-select: none;
  }
  .sub-nav-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #000; }
  .sub-nav-btn.active { background: #1e3a8a; border-color: #3b82f6; box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }

  .cms-page button, .cms-page .sub-btn {
    background: linear-gradient(180deg, #334155 0%, #1e293b 100%); border: 2px solid #475569; color: #f1f5f9; padding: 10px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; box-shadow: 0 3px 0 #000; transition: all 0.05s;
    width: auto; min-width: 100px; margin-bottom: 5px; display: inline-flex; align-items: center; justify-content: center;
  }
  .cms-page button:active, .cms-page .sub-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #000; }
  .cms-page button.secondary { background: #1e293b; color: #94a3b8; border-color: #334155; }
  .sub-btn.highlight { border-color: #fbbf24 !important; color: #fbbf24 !important; box-shadow: 0 0 10px #78350f !important; animation: blink-yellow-light 1s infinite !important; }
  @keyframes blink-yellow-light { 50% { opacity: 0.7; border-color: #f59e0b; } }

  .cms-layout { display: grid; grid-template-columns: 1fr 140px; gap: 15px; height: 100%; }
  .cms-gear-display { width: 60px; height: 60px; background: #000; border: 3px solid #475569; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; color: #4ade80; border-radius: 8px; }
  .cms-gear-display.fault { color: #ef4444; border-color: #ef4444; }
  .atp-hmi { width: 100px; height: 75px; background: #064e3b; border: 2px solid #334155; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .atp-hmi.fault { background: #7f1d1d; }
  .atp-limit { font-size: 36px; font-weight: bold; }
  .cms-icon { width: 45px; height: 45px; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; border-radius: 6px; }
  .cms-icon.active-t { color: #4ade80; border-color: #4ade80; }
  .cms-icon.inactive { color: #1e293b; border-color: #1e293b; }
  .cms-icon.fault { color: #ef4444; border-color: #ef4444; animation: blink 1s infinite; }
  .door-box { height: 14px; background: #1e293b; border: 1px solid #334155; }
  .door-box.open { background: #3b82f6; }
  .door-box.offline { background: #4b5563; position: relative; }
  .door-box.offline::after { content: "×"; color: #fff; position: absolute; top: -4px; left: 2px; font-size: 12px; }
  @keyframes blink { 50% { opacity: 0.3; } }
  @keyframes blink-yellow { 50% { background: #78350f; } }
  .emergency-panel { background: #450a0a; border: 2px solid #991b1b; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
  .em-btn { background: #7f1d1d; color: #fff; border: 2px solid #dc2626; padding: 12px; font-size: 14px; border-radius: 4px; text-align: center; font-weight: bold; cursor: pointer; }
  .em-btn.highlight { background: #ef4444; box-shadow: 0 0 15px #ef4444; }
  .em-btn.used { background: #1e293b; color: #475569; border-color: #334155; cursor: not-allowed; }
  .chunk { background: #0f172a; border-left: 3px solid #3b82f6; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .chunk.final { border-left-color: #10b981; }
  .chunk-title { font-size: 13px; color: #fbbf24; font-weight: bold; margin-bottom: 8px; }
  .line { padding: 6px 0 6px 56px; position: relative; border-top: 1px dashed #334155; }
  .line .who { position: absolute; left: 0; top: 6px; font-weight: bold; width: 52px; font-size: 13px; }
  .line.driver .who { color: #60a5fa; }
  .line.occ .who { color: #fb923c; }
  .bogie-unit { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #334155; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
  .bogie-unit.selected { border-color: #3b82f6; background: #1d4ed8; color: white; }
  .bogie-unit.isolated { border-color: #fbbf24; background: #78350f; color: #fbbf24; }
  .progress { font-size: 13px; color: #94a3b8; margin-bottom: 8px; text-align: center; }
</style>
</head>

<div class="main-content">
  <h1>淡海輕軌正線無線電練習</h1>

    <div style="color: #fca5a5; font-size: 12px; margin-bottom: 8px; font-weight: bold;">應急實體面板</div>
    <div id="em-btns" class="em-btn-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;"></div>
  </div>
  <div class="card">
    <h2>① 運轉設定</h2>
    <div class="row">
      <div><label>車號</label><input id="trainId" type="text" value="101" maxlength="4" inputmode="numeric"></div>
      <div><label>練習情境</label><select id="scenario">
        <option value="normal">正常運轉</option><option value="random_fault">隨機故障排除 (故排)</option><option value="clear">異常處理 (清車)</option><option value="delay_intersection">未能通過路口 (紅燈)</option>
        <optgroup label="故障排除 (故排)">
          <option value="fault_traction">牽引系統故障</option><option value="fault_brake">煞車系統故障</option><option value="fault_power">供電系統故障</option><option value="fault_door">車門系統故障</option><option value="fault_speed">輔助速限裝置故障</option><option value="fault_ac">空調系統故障</option><option value="fault_restart">清車重開機</option>
        </optgroup>
        <optgroup label="營運情境">
          <option value="scenario_point">轉轍器手動扳轉</option><option value="scenario_pei">PEI 旅客對講機</option>
        </optgroup></select></div>
    </div>
  </div>
  <div class="card">
    <h2>② 起訖車站</h2>
    <div class="row"><select id="fromArea"></select><select id="fromDetail"></select></div>
    <div class="row"><select id="toArea"></select><select id="toDetail"></select></div>
    <select id="endAction"><option value="continue">換端後繼續發車</option><option value="finish">換端後返回車班</option></select>
  </div>
  <button id="genBtn">產生正線運轉程序</button>
  <div id="result"></div>
</div>

<script>
// 站序對照表（上行：V01→V11→V26，下行反向）
const STATION_SEQUENCE = ["V01","V02","V03","V04","V05","V06","V07","V08","V09","V10","V11"];
const BLUE_SEQUENCE    = ["V01","V26","V27","V28"];

function getAdjacentFaultLocation(from, to) {
  // 取得 from 和 to 的站名（去掉月台）
  const getStation = s => s.replace(/ [12]月台.*/, '').trim();
  const fromSt = getStation(from);
  const toSt   = getStation(to);

  // 決定用哪個序列
  let seq = STATION_SEQUENCE;
  if (fromSt === 'V26' || toSt === 'V26' || fromSt === 'V27' || toSt === 'V27' || fromSt === 'V28' || toSt === 'V28') {
    seq = BLUE_SEQUENCE;
  }

  const fi = seq.indexOf(fromSt);
  const ti = seq.indexOf(toSt);

  // 若找不到站序（如路口、機廠），fallback 用原本的描述
  if (fi === -1 || ti === -1) return `${from} 往 ${to} 途中`;

  const direction = ti > fi ? 1 : -1;
  // 從 from 開始往 to 方向，收集途中的站（不含起終點）
  const midStations = [];
  for (let i = fi + direction; i !== ti; i += direction) {
    midStations.push(seq[i]);
  }

  // 加入 from 的下一站（司機員最容易報告的相鄰段）
  const nextSt = seq[fi + direction];
  if (!nextSt) return `${from} 往 ${to} 途中`;

  // 在 from 與 from下一站 之間隨機插入故障，或在中間某站間插入
  const candidates = [];
  // 至少有 from→nextSt 這一段
  candidates.push({ a: fromSt, b: nextSt });
  // 若途中還有其他站，也加入候選
  for (let i = 0; i < midStations.length; i++) {
    const cur = midStations[i];
    const nxt = midStations[i+1] || toSt;
    candidates.push({ a: cur, b: nxt });
  }
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  return `${pick.a} 往 ${pick.b} 之間途中`;
}

function switchCMSTab(tab) {
  const pages = document.querySelectorAll('.cms-page');
  const mainBtns = document.querySelectorAll('.cms-main-nav .nav-btn');
  const subBtns = document.querySelectorAll('.sub-nav-btn');
  pages.forEach(p => p.classList.remove('active'));
  const targetPage = document.getElementById(`p-${tab}`); if(targetPage) targetPage.classList.add('active');
  const ctrlTabs = ['propulsion', 'ac', 'door', 'brake'];
  if (!ctrlTabs.includes(tab)) document.getElementById('sub-nav-control').classList.remove('active');
  mainBtns.forEach(b => {
    const map = { home:'首頁', settings:'設定', monitor:'監視', control:'控制', diag:'診斷' };
    b.classList.remove('active'); if (b.innerText === map[tab] || (ctrlTabs.includes(tab) && b.innerText === '控制')) b.classList.add('active');
  });
  subBtns.forEach(b => {
    const map = { propulsion:'推進', ac:'空調', door:'車門', brake:'煞車' };
    b.classList.remove('active'); if (b.innerText === map[tab]) b.classList.add('active');
  });
}

function handleCMSClick(action) {
  if (pendingAction === action || (action === '隔離轉向架' && pendingAction === '煞車解除')) {
    if (action === 'TCU錯誤復位') {
      document.getElementById('btn-tcu-reset').style.background = "#10b981";
      setTimeout(() => {
        document.getElementById("cms-t").className = "cms-icon active-t";
        ["t-m1-1","t-m1-2","t-m5-1","t-m5-2"].forEach(id => document.getElementById(id).className = "cms-icon active-t");
        document.getElementById("diag-content").innerText = "無主動故障紀錄"; document.getElementById("nav-diag").classList.remove('alert');
      }, 300);
    }
    if (action === '空調重置') document.getElementById('btn-ac-reset').style.background = "#10b981";
    if (action === '全開全關') document.getElementById('btn-door-all').style.background = "#10b981";
    if (action === '隔離轉向架') { 
      const bNames = ['m1','m3','m5'];
      const selBogie = bNames[currentBogieIdx];
      document.querySelector('.bogie-unit.selected').classList.add('isolated');
      if (selBogie === persistentFault.bogie) {
        // 隔離正確轉向架：標記已隔離 → 列車回復 HB 可移動（ERR 標籤持續顯示直到重開機）
        persistentFault.isolated = true;
        document.getElementById("cms-gear").innerText = "HB";
        document.getElementById("cms-gear").className = "cms-gear-display";
        document.getElementById("cms-t").className = "cms-icon active-t";
        document.getElementById('btn-bogie-isolate').style.background = "#10b981";
        completedActions.add(revealed); setTimeout(() => { pendingAction = null; render(); }, 500);
      }
      // 隔離錯誤轉向架：不完成步驟，維持 E1 故障，使用者可切換其他轉向架重試
      return;
    }
    if (action === '後視鏡重置') document.getElementById('btn-mirror-reset').style.background = "#10b981";
    completedActions.add(revealed); setTimeout(() => { pendingAction = null; render(); }, 500);
  } else if (action === '隔離轉向架') {
    document.querySelector('.bogie-unit.selected').classList.toggle('isolated');
  }
}

function handleEmergencyClick(action) {
  if (pendingAction === action) {
    activeEmergencyButtons.add(action); // 記錄已按壓的應急按鈕
    completedActions.add(revealed);
    // 若是清車重開機按下降級模式，觸發復歸
    if (action === '降級模式') {
      const lastChunk = currentChunks[revealed - 1];
      if (lastChunk && lastChunk.faultKey === 'fault_restart') {
        resetFaultState(true); // 清車重開機：復歸所有應急按鈕
      }
    }
    pendingAction = null;
    render();
  }
}

function updateEmergencyPanel(action) {
  const panel = document.getElementById('emergency-panel');
  if (!action) { panel.style.display = "none"; return; }
  panel.style.display = "block";
  const buttons = ["列車自動保護 Bypass", "煞車解除", "集電弓降弓 HV OFF", "上下車門", "降級模式", "ATP重置"];
  document.getElementById('em-btns').innerHTML = buttons.map(b => {
    const isTarget  = b === action;
    const isUsed    = activeEmergencyButtons.has(b) && !isTarget;
    const cssClass  = isTarget ? 'highlight' : (isUsed ? 'used' : '');
    const clickable = isTarget && !activeEmergencyButtons.has(b);
    return `<div class="em-btn ${cssClass}" ${clickable ? `onclick="handleEmergencyClick('${b}')"` : ''}>${b}${isUsed ? ' ✓' : ''}</div>`;
  }).join("");
}

function addMinutesToTime(timeStr, mins) {
  const [h, m] = timeStr.split(':').map(Number);
  const date = new Date(); date.setHours(h, m + mins);
  return `${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
}

function buildPoints(fA, fD, tA, tD, depTime, scenario, endAction) {
  let pts = [];
  function getTravelTime(f, t) {
    if ((f.includes("V01")&&t.includes("V11")) || (f.includes("V11")&&t.includes("V01"))) return 23;
    if (f.includes("V01")&&t.includes("V26")) return 27; if (f.includes("V26")&&t.includes("V01")) return 28;
    return (f.includes("V26")||t.includes("V26")) ? 28 : 23;
  }
  let legs = [];
  if ((fD.includes("V11")||fD.includes("1-0")||fD.includes("2-0")) && tD.includes("V26")) legs = [{f:fD, t:"V01 2月台"}, {f:"V01 2月台", t:tD}];
  else if (fD.includes("V26") && tD.includes("V11")) legs = [{f:fD, t:"V01 1月台"}, {f:"V01 1月台", t:tD}];
  else legs = [{f:fD, t:tD}];

  let runningTime = depTime;
  for (let i = 0; i < legs.length; i++) {
    const leg = legs[i]; const r = ROUTES_MAP[`${leg.f}-${leg.t}`] || "無路徑";
    let curPt = null;
    if (i === 0) {
      if (leg.f.includes("1-0")) curPt = { loc: leg.f, report: "已完成車底車外巡視，做好動車前準備", _isBackupDeparture10: true };
      else if (leg.f.includes("2-0")) curPt = { loc: leg.f, report: "已完成交接做好動車前準備", _isBackupDeparture20: true };
      else if (fA === "depot") curPt = { loc: leg.f, report: `已停妥${leg.f}，做好動車前準備`, _isDepotDeparture: true };
      else { let act = leg.f.includes("V11 2月台") ? "勤務交接" : "換端"; curPt = { loc: leg.f, report: `已完成${act}，接收建議路徑${r}，確認前方號誌開通，依時刻表${runningTime}發車`, _isChangeEnd: true }; }
    } else { curPt = { loc: leg.f, report: `已完成換端，接收建議路徑${r}，確認前方號誌開通，依時刻表${runningTime}發車`, _isChangeEnd: true }; }
    pts.push(curPt);

    if (scenario === "normal" && leg.t.includes("V01")) pts.push({ _isTetraSpecial: true, loc: "V09 2月台", report: "稍早通過J04路口時，列車牽引動力不足，僅消耗M2儲能電池，M2電池70%，M4電池90%，診斷頁面顯示ESS1放電電流過大/ESS1電池芯電壓差過大/ESS1電池偵測版異常，電池未跳脫" });
    runningTime = addMinutesToTime(runningTime, getTravelTime(leg.f, leg.t) + 6);

    const roll = Math.random();
    if ((scenario === "random_fault" && roll > 0.3) || (scenario.startsWith("fault_"))) {
      const fKey = scenario.startsWith("fault_") ? scenario : Object.keys(FAULT_DATA)[Math.floor(Math.random()*7)];
      const faultLoc = getAdjacentFaultLocation(leg.f, leg.t);
      pts.push({ loc: faultLoc, _isFaultScenario: true, faultKey: fKey, faultName: FAULT_DATA[fKey].name, steps: FAULT_DATA[fKey].steps });
    } else if (scenario === "scenario_point") {
      pts.push({ loc: "V09 1月台", _isPointScenario: true, pointId: "EPM100", side: "左位" });
    } else if (scenario === "scenario_pei") {
      pts.push({ loc: `${leg.f} 往 ${leg.t} 途中`, _isPEIScenario: true });
    } else if (scenario === "delay_intersection") {
      const j = AREAS.intersections.items[Math.floor(Math.random()*18)];
      pts.push({ loc: j, _isDelayScenario: true, isUplink: (leg.t.includes("V11")||leg.t.includes("V26")), report: `稍早於${leg.f}等候旅客上下車，未能通過${j}，待下一輪號誌開通後再通過路口` });
    }
  }
  const finalPt = (tA === "depot") ? { loc: tD, report: `已停妥${tD}${tD.includes("2-0")?"，完成交接":"，Tetra轉G01完成"}`, isFinal: true } : { loc: tD, report: `已完成換端，接收建議路徑${ROUTES_MAP[tD+'-'+fD] || '[路徑號]'}，確認前方號誌開通，依時刻表發車`, isFinal: true };
  pts.push(finalPt);

  return pts;
}

function makeChunks(trainId, pts) {
  const chunks = [];
  pts.forEach((cur, i) => {
    const nxt = pts[i+1];
    if (cur._isTetraSpecial) {
      const call = `${cur.loc}，${trainId}車呼叫OCC，${cur.report}，OVER`;
      const reply = `OCC收到，${cur.loc}${trainId}車回報，${cur.report}，請${trainId}車執行TCU錯誤復位後持續留意觀察，通話完畢。`;
      const repeat = `${trainId}車收到，執行TCU錯誤復位後持續留意觀察，通話完畢。`;
      chunks.push({ title: "【無線電】Tetra 故障回報", lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }, { who: "司機員", text: repeat }], requireAction: "TCU錯誤復位", faultKey: "tetra_special" });
    } else if (cur._isPointScenario) {
      const occCall = `OCC呼叫${cur.loc}${trainId}車，請${trainId}車司機員攜帶轉轍桿、Tetra、車間門鑰匙至轉轍器${cur.pointId}前，將轉轍器${cur.pointId}扳轉至${cur.side}定位後回報，OVER`;
      const driverRepeat = `${trainId}車收到，攜帶轉轍桿、Tetra、車間門鑰匙至轉轍器${cur.pointId}前，將轉轍器${cur.pointId}扳轉至${cur.side}定位後回報，通話完畢。`;
      chunks.push({ title: "【營運】轉轍器手動扳轉 - 指示", lines: [{ who: "OCC", text: occCall }, { who: "司機員", text: driverRepeat }] });
      
      const driverReport = `${cur.loc}${trainId}車呼叫OCC，已將${cur.pointId}扳轉至${cur.side}定位，確認軌尖密合，OVER`;
      const occReply = `OCC收到，已確認${cur.pointId}扳轉至${cur.side}定位，確認軌尖密合，請${trainId}車司機員返回列車，稍後可冒前方雙燈，依路口四燈號誌通過，沿途請確認轉轍器方位正確後再慢速通過，通話完畢。`;
      chunks.push({ title: "【營運】轉轍器手動扳轉 - 完成", lines: [{ who: "司機員", text: driverReport }, { who: "OCC", text: occReply }] });
    } else if (cur._isPEIScenario) {
      const call = `${cur.loc}，${trainId}車呼叫OCC，稍早旅客按壓 PEI，通報有旅客身體不適，請求於下一站停車並由救護人員協助，OVER`;
      const reply = `OCC收到，${trainId}車，請於下一站停車待命，已通知相關人員，OVER`;
      const repeat = `${trainId}車收到，於下一站停車待命，通話完畢。`;
      chunks.push({ title: "【營運】PEI 旅客對講機", lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }, { who: "司機員", text: repeat }] });
    } else if (cur._isFaultScenario) {
      cur.steps.forEach((s, idx) => {
        const call = `${cur.loc}，${trainId}車呼叫OCC，${s.report}，OVER`;
        if (s.type === "final") {
          const reply = `OCC收到，${trainId}車回報，${s.report.replace(/。請問.*$/,"")}，准許${trainId}車發車回報之要求，通話完畢。`;
          chunks.push({ title: `【故排】${cur.faultName} - 步驟 ${idx+1}`, lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }], requireAction: null, faultKey: cur.faultKey });
        } else {
          const act = s.type === 'cms' ? `執行CMS「${s.action}」作業` : `按壓應急按鈕「${s.action}」`;
          const reply = `OCC收到，${trainId}車，請${act}，確認列車是否恢復，OVER`;
          const repeat = `${trainId}車收到，${act}，通話完畢。`;
          chunks.push({ title: `【故排】${cur.faultName} - 步驟 ${idx+1}`, lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }, { who: "司機員", text: repeat }], requireAction: s.action, faultKey: cur.faultKey });
        }
      });
    } else if (cur._isDelayScenario) {
      const call = `${cur.loc}，${trainId}車呼叫OCC，${cur.report}，OVER`;
      const reply = `OCC收到，${cur.loc}${trainId}車回報，${cur.report}，請待下一輪號誌開通，確認路口淨空後通過，OVER`;
      const repeat = `${trainId}車收到，待下一輪號誌開通，確認路口淨空後通過，通話完畢。`;
      chunks.push({ title: `【延誤】${cur.loc}紅燈`, lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }, { who: "司機員", text: repeat }] });
    } else {
      const call = `${cur.loc}，${trainId}車呼叫OCC，${cur.report}，OVER`;
      const reply = `OCC收到，${cur.loc}${trainId}車回報，${cur.report}，通話完畢。`;
      chunks.push({ title: cur.isFinal ? "【終點】" : "【起始】", isFinal: cur.isFinal, lines: [{ who: "司機員", text: call }, { who: "OCC", text: reply }] });
    }
  });
  return chunks;
}

function render() {
  const box = document.getElementById("result"); if (currentChunks.length === 0) return;
  const lastChunk = currentChunks[revealed - 1];
  if (lastChunk && lastChunk.faultKey) updateCMSDisplay(lastChunk.faultKey);
  const cmsActions = ['TCU錯誤復位', '隔離轉向架', '全開全關', '空調重置', '後視鏡重置'];
  pendingAction = (lastChunk && !completedActions.has(revealed)) ? lastChunk.requireAction : null;
  document.querySelectorAll('.sub-btn, .sub-nav-btn, .nav-btn').forEach(b => b.classList.remove('highlight'));
  if (pendingAction) {
    if (cmsActions.includes(pendingAction)) {
      if (pendingAction === 'TCU錯誤復位') { document.getElementById('nav-control').classList.add('alert'); document.getElementById('btn-sub-propulsion').classList.add('highlight'); document.getElementById('btn-tcu-reset').classList.add('highlight'); }
      if (pendingAction === '後視鏡重置') document.getElementById('btn-mirror-reset').classList.add('highlight');
      if (pendingAction === '空調重置') { document.getElementById('nav-control').classList.add('alert'); document.getElementById('btn-sub-ac').classList.add('highlight'); document.getElementById('btn-ac-reset').classList.add('highlight'); }
      if (pendingAction === '隔離轉向架') { document.getElementById('nav-control').classList.add('alert'); document.getElementById('btn-sub-brake').classList.add('highlight'); document.getElementById('btn-bogie-isolate').classList.add('highlight'); }
      if (pendingAction === '全開全關') { document.getElementById('nav-control').classList.add('alert'); document.getElementById('btn-sub-door').classList.add('highlight'); document.getElementById('btn-door-all').classList.add('highlight'); }
      updateEmergencyPanel(null);
    } else updateEmergencyPanel(pendingAction);
  } else updateEmergencyPanel(null);

  const progress = `<div class="progress">已顯示 ${revealed} / ${currentChunks.length} 段</div>`;
  const shown = currentChunks.slice(0, revealed).map(c => `<div class="chunk ${c.isFinal?'final':''}"><div class="chunk-title">${c.title}</div>${c.lines.map(l=>`<div class="line ${l.who==='司機員'?'driver':'occ'}"><span class="who">${l.who}</span><span class="text">${l.text}</span></div>`).join("")}</div>`).join("");
  let nextBtn = (revealed < currentChunks.length) ? `<button id="nextBtn" ${pendingAction ? 'disabled' : ''}>${pendingAction ? '等待執行操作：'+pendingAction : '繼續 — 已完成上段回報'}</button>` : `<button onclick="location.reload()">重新開始</button>`;
  box.innerHTML = `<div class="card"><h2>無線電對話</h2>${progress}${shown}${nextBtn}</div>`;
  const nb = document.getElementById("nextBtn"); if(nb) nb.onclick = () => { revealed++; render(); window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'}); };
}

const fA_el = document.getElementById("fromArea"); const fD_el = document.getElementById("fromDetail");
const tA_el = document.getElementById("toArea"); const tD_el = document.getElementById("toDetail");
const fill = (sel, keys) => sel.innerHTML = keys.map(k => `<option value="${k}">${AREAS[k].label}</option>`).join("");
const fillD = (sel, area) => sel.innerHTML = AREAS[area].items.map(v => `<option value="${v}">${v}</option>`).join("");
fill(fA_el, ["mainline", "blue"]); fill(tA_el, ["mainline", "green", "blue", "depot"]);
fillD(fD_el, fA_el.value); fillD(tD_el, tA_el.value);
fA_el.onchange = () => fillD(fD_el, fA_el.value); tA_el.onchange = () => fillD(tD_el, tA_el.value);

// 視窗比 CMS 設計寬度(640)窄時（手機），整個 CMS 等比例縮小以完整顯示、不裁切；桌機維持原寸置中
function fitCMS() {
  const cms = document.getElementById('cms');
  const DESIGN = 640, H = 335;
  if (window.innerWidth < DESIGN) {
    const s = window.innerWidth / DESIGN;
    Object.assign(cms.style, { width: DESIGN + 'px', maxWidth: 'none', left: '0', right: 'auto', marginLeft: '0', marginRight: '0', transformOrigin: 'top left', transform: 'scale(' + s + ')' });
    document.body.style.paddingTop = Math.ceil(H * s + 10) + 'px';
  } else {
    ['width','maxWidth','left','right','marginLeft','marginRight','transformOrigin','transform'].forEach(k => cms.style[k] = '');
    document.body.style.paddingTop = '';
  }
}
window.addEventListener('resize', fitCMS);
fitCMS();

document.getElementById("genBtn").onclick = () => {
  const tId = document.getElementById("trainId").value || "101";
  const scenario = document.getElementById("scenario").value;
  const depTime = `${String(Math.floor(Math.random()*24)).padStart(2,'0')}:${String(Math.floor(Math.random()*60)).padStart(2,'0')}`;
  completedActions.clear();
  activeEmergencyButtons.clear(); // 每次重新產生情境，清空應急按鈕狀態
  resetFaultState(false);
  currentChunks = makeChunks(tId, buildPoints(fA_el.value, fD_el.value, tA_el.value, tD_el.value, depTime, scenario, document.getElementById("endAction").value));
  revealed = 1; render();
};
</script>
